plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.143'
    id 'idea'
}

tasks.named('wrapper', Wrapper).configure {
    // Define wrapper values here so as to not have to always do so when updating gradlew.properties.
    // Switching this to Wrapper.DistributionType.ALL will download the full gradle sources that comes with
    // documentation attached on cursor hover of gradle classes and methods. However, this comes with increased
    // file size for Gradle. If you do switch this to ALL, run the Gradle wrapper task twice afterwards.
    // (Verify by checking gradle/wrapper/gradle-wrapper.properties to see if distributionUrl now points to `-all`)
    distributionType = Wrapper.DistributionType.BIN
}

version = mod_version
group = mod_group_id

sourceSets.main.resources {
    // Include resources generated by data generators.
    srcDir('src/generated/resources')

    // Exclude common development only resources from finalized outputs
    exclude("**/*.bbmodel") // BlockBench project files

    exclude("src/generated/**/.cache") // datagen cache files
}

repositories {
    // Add here additional repositories if required by some of the dependencies below.

    // Curios（饰品栏）。作者的 maven.blamejared.com 上已经找不到 1.21.1 的
    // 构件了，Modrinth 官方 maven 有，且与 Modrinth 上的发布同源。
    // 用 content 把它限定在 maven.modrinth 这一个 group：不限定的话，
    // 每解析一个依赖都要先来问它一次，构建平白慢一截。
    maven {
        name = "Modrinth"
        url = "https://api.modrinth.com/maven"
        content {
            includeGroup "maven.modrinth"
        }
    }

    // AE2WTLib 的 api 模块 —— 只有这一个 group 从这儿取。
    //
    // ⚠ AE2 本体【不能】从这儿取：modmaven 的 appeng 镜像停在 19.0.4-alpha，
    // 1.21.1 要的 19.2.x 一个都没有。
    maven {
        name = "modmaven"
        url = "https://modmaven.dev"
        content {
            includeGroup "de.mari_023"
        }
    }
}

base {
    archivesName = mod_id
}

// Mojang ships Java 21 to end users in 1.21.1, so mods should target Java 21.
java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    // Specify the version of NeoForge to use.
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    // This line is optional. Access Transformers are automatically detected
    // accessTransformers = project.files('src/main/resources/META-INF/accesstransformer.cfg')

    // Default run configurations.
    // These can be tweaked, removed, or duplicated as needed.
    runs {
        client {
            client()
            // Comma-separated list of namespaces to load gametests from. Empty = all namespaces.
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
        // This run config launches GameTestServer and runs all registered gametests, then exits.
        // By default, the server will crash when no gametests are provided.
        // The gametest system is also enabled by default for other run configs under the /test command.
        gameTestServer {
            type = "gameTestServer"
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        data {
            data()
            // example of overriding the workingDirectory set in configureEach above, uncomment if you want to use it
            // gameDirectory = project.file('run-data')

            // Specify the modid for data generation, where to output the resulting resource, and where to look for existing resources.
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }

        // applies to all the run configs above
        configureEach {
            // Recommended logging data for a userdev environment
            // The markers can be added/remove as needed separated by commas.
            // "SCAN": For mods scan.
            // "REGISTRIES": For firing of registry events.
            // "REGISTRYDUMP": For getting the contents of all registries.
            systemProperty 'forge.logging.markers', 'REGISTRIES'

            // Recommended logging level for the console
            // You can set various levels here.
            // Please read: https://stackoverflow.com/questions/2031163/when-to-use-the-different-log-levels
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        // define mod <-> source bindings
        // these are used to tell the game which sources are for which mod
        // multi mod projects should define one per mod
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

// Sets up a dependency configuration called 'localRuntime'.
// This configuration should be used instead of 'runtimeOnly' to declare
// a dependency that will be present for runtime testing but that is
// "optional", meaning it will not be pulled by dependents of this mod.
configurations {
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
    // Curios —— 可选依赖：装了就能把手机挂在腰上，没装则一切照旧。
    //
    // compileOnly 而不是 implementation：我们只在运行时【如果】Curios 在场
    // 才去调它，编译期有类型就够了。写成 implementation 会把 Curios 变成
    // 必需品，没装的玩家直接加载失败。
    //
    // localRuntime 让开发环境的 runClient 真的装上 Curios，好把这条路径
    // 跑一遍；用它而不是 runtimeOnly，是为了不把这份依赖传播给下游。
    compileOnly "maven.modrinth:curios:${curios_version}"
    localRuntime "maven.modrinth:curios:${curios_version}"

    // Waystones（传送石碑）+ Balm —— 可选依赖：装了就多一个「传送石」App，
    // 没装则该 App 连应用商店里都不会出现。
    //
    // 同样是 compileOnly：所有调用都关在 WaystonesCompat 里，运行期由
    // ModList 判断在不在场。
    //
    // Balm 必须单独写一行。它是 Waystones 的前置【模组】而不是被打包进去的
    // 库，Waystones 的 jar 里没有 net.blay09.mods.balm.*——漏了这行，编译期
    // 就找不到 Balm.networking()，而错误信息只会说某个符号找不到，不会提示
    // 你少加了一个依赖。
    compileOnly "maven.modrinth:waystones:${waystones_version}"
    compileOnly "maven.modrinth:balm:${balm_version}"
    localRuntime "maven.modrinth:waystones:${waystones_version}"
    localRuntime "maven.modrinth:balm:${balm_version}"

    // MCEF —— 可选依赖：装了就多一个「浏览器」App，没装则该 App 不出现。
    //
    // 它是【客户端】库（把 Chromium 渲染成一张 GL 纹理）。所有引用都关在
    // client/browser 包里，服务端一个字节都不会碰到。
    //
    // 只写 compileOnly、不写 localRuntime：它首次运行要下载约 200 MB 的
    // java-cef 原生库，开发环境里每次 runClient 都可能触发，代价太大。真要跑
    // 浏览器时把 jar 手动丢进 run/mods 即可。
    compileOnly "maven.modrinth:mcef:${mcef_version}"

    // NetMusic（网络音乐机）—— 可选依赖：装了就能把它刻出来的 CD 塞进手机的
    // 唱片仓，走到哪儿放到哪儿、周围人都听得见；没装则唱片仓照旧只收原版唱片。
    //
    // 同样是 compileOnly：所有引用都关在 NetMusicCompat 与音乐那一支的客户端
    // 播放层里，运行期由 ModList 判断在不在场。
    //
    // 要当心的是它【没有对外的 API 包】：我们用到的 ItemMusicCD.getSongInfo
    // 与 MusicPlayManager.play 都在它的内部包里。所以接触面必须小 —— 只读
    // 一个数据组件、只调一个播放入口，别顺手用它别的东西。它改版时断的地方
    // 越少越好，而断了会是 NoSuchMethodError 这类 Error，兼容层里兜的是
    // Throwable 不是 Exception，正是为了这个。
    compileOnly "maven.modrinth:net-music:${netmusic_version}"
    localRuntime "maven.modrinth:net-music:${netmusic_version}"

    // Patchouli（教程手册）—— 可选依赖：装了就多一个「阅读」App，把整合包里
    // 所有教程书收进手机，没装则该 App 不出现。
    //
    // 同样是 compileOnly：所有引用都关在 feature/reader/client 下，运行期由
    // ModList 判断在不在场。
    //
    // 接触面刻意只有四样：BookRegistry.INSTANCE.books（有哪些书）、
    // Book 上的几个公开字段与 getOwnerName/getIcon（书名、出处、图标）、
    // PatchouliAPI.openBookGUI（翻书）。其中只有最后一个属于它的 api 包，
    // 前面几个是内部类——所以版本挑的是【最老】的那个，理由见 gradle.properties。
    //
    // 不写 localRuntime：开发环境里没有任何模组带书，装上它只会多加载一个模组，
    // 那条路径要真跑，把整合包里的 jar 丢进 run/mods 更接近现场。
    compileOnly "maven.modrinth:patchouli:${patchouli_version}"

    // 三家存储模组 —— 可选依赖：装了哪家，「终端」App 就能开哪家的终端；一家都
    // 没装时那一格不上主屏。全部引用都关在 feature/terminal/integration 下面，
    // 运行期在不在场由 ModList 判断，而判断只在 Terminals.discover() 那三行里。
    //
    // localRuntime 三家一起装：只有把它们真装在同一个开发环境里，才验得到
    // "同时装了两家""只装了一家"这些真实组合。嫌 runClient 沉就临时注掉，
    // 但发版前要三家都跑一遍。
    compileOnly "maven.modrinth:ae2:${ae2_version}"
    localRuntime "maven.modrinth:ae2:${ae2_version}"

    // GuideME —— AE2 自己的前置，我们一行不碰。两处都要放，理由见 gradle.properties。
    compileOnly "maven.modrinth:guideme:${guideme_version}"
    localRuntime "maven.modrinth:guideme:${guideme_version}"

    // AE2WTLib —— 编译期只要 api 模块（就一个 ItemWT 类型），运行期在开发环境里
    // 装整个模组，好把"装了它"那条路真跑一遍。
    compileOnly "de.mari_023:ae2wtlib_api:${ae2wtlib_version}"
    localRuntime "maven.modrinth:applied-energistics-2-wireless-terminals:${ae2wtlib_version}"

    compileOnly "maven.modrinth:refined-storage:${refinedstorage_version}"
    localRuntime "maven.modrinth:refined-storage:${refinedstorage_version}"

    // 坐标上是 1.21-2.4.2，mods.toml 里自报的是 2.4.2 —— 两个数不一样，
    // 理由见 gradle.properties。
    compileOnly "maven.modrinth:toms-storage:${toms_version}"
    localRuntime "maven.modrinth:toms-storage:${toms_version}"

    // JavaMP3 —— MP3 解码。这是【必需】依赖，不是可选联动：玩家往音乐
    // 目录里丢一个 mp3，不该要求他再去装别的模组。
    //
    // jarJar 而不是 implementation：模组 jar 不会自动带上第三方库，只写
    // implementation 的话开发环境跑得起来、发出去的 jar 一运行就
    // NoClassDefFoundError。jarJar 把它嵌进 jar 里，由 NeoForge 在加载时
    // 展开；版本写成区间是 JarJar 的硬要求（它要在多个模组嵌了同一个库时
    // 挑一个满足所有人的版本）。
    //
    // 选它的理由：纯 Java、零依赖、MIT。GitHub 上纯 Java 的 MP3 解码器里，
    // 非 LGPL 的实际上只有它一个（JLayer 与 mp3spi 都是 LGPL，而 LGPL 的
    // 库嵌进要分发的 jar 里是个说不清的灰区）。
    jarJar(implementation("fr.delthas:javamp3:[${javamp3_version},2.0)"))

    // Example optional mod dependency with JEI
    // The JEI API is declared for compile time use, while the full JEI artifact is used at runtime
    // compileOnly "mezz.jei:jei-${mc_version}-common-api:${jei_version}"
    // compileOnly "mezz.jei:jei-${mc_version}-neoforge-api:${jei_version}"
    // We add the full version to localRuntime, not runtimeOnly, so that we do not publish a dependency on it
    // localRuntime "mezz.jei:jei-${mc_version}-neoforge:${jei_version}"

    // Example mod dependency using a mod jar from ./libs with a flat dir repository
    // This maps to ./libs/coolmod-${mc_version}-${coolmod_version}.jar
    // The group id is ignored when searching -- in this case, it is "blank"
    // implementation "blank:coolmod-${mc_version}:${coolmod_version}"

    // Example mod dependency using a file as dependency
    // implementation files("libs/coolmod-${mc_version}-${coolmod_version}.jar")

    // Example project dependency using a sister or child project:
    // implementation project(":myproject")

    // For more info:
    // http://www.gradle.org/docs/current/userguide/artifact_dependencies_tutorial.html
    // http://www.gradle.org/docs/current/userguide/dependency_management.html
}

// This block of code expands all declared replace properties in the specified resource targets.
// A missing property will result in an error. Properties are expanded using ${} Groovy notation.
var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            neo_version_range      : neo_version_range,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}
// Include the output of "generateModMetadata" as an input directory for the build
// this works with both building through Gradle and the IDE.
sourceSets.main.resources.srcDir generateModMetadata
// To avoid having to run "generateModMetadata" manually, make it run on every project reload
neoForge.ideSyncTask generateModMetadata

// Example configuration to allow publishing using the maven-publish plugin
publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8' // Use the UTF-8 charset for Java compilation
}

// IDEA no longer automatically downloads sources/javadoc jars for dependencies, so we need to explicitly enable the behavior.
idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}

// ============================================================
//  SPI 服务文件校验
// ============================================================
//
// META-INF/services/ 里写的是全限定类名，纯文本，编译器一个字都不看。类改名
// 或搬包之后忘了同步这里，构建照样成功，jar 照样能装——只是运行时 ServiceLoader
// 一个实现都找不到，手机里空空如也，而且不报错。
//
// 1.2.11 那次把 128 个文件重排包结构时就差点这么发出去。这个失败模式没有任何
// 现成的东西挡得住，只能自己在构建期校验一遍：文件里写的每一个类，编译产物里
// 必须真的存在。
//
// 挂在 check 上而不是只在发版时跑：这种错要在本地 build 就炸出来，而不是等到
// CI 或者玩家装上之后。
tasks.register('verifyServiceFiles') {
    description = '校验 META-INF/services 里写的类都真实存在'
    group = 'verification'

    dependsOn tasks.named('compileJava')

    def servicesDir = file('src/main/resources/META-INF/services')
    def classesDir = layout.buildDirectory.dir('classes/java/main')

    inputs.dir(servicesDir).optional()
    inputs.dir(classesDir).optional()

    doLast {
        if (!servicesDir.exists()) return

        def missing = []
        def total = 0
        servicesDir.eachFile { f ->
            f.eachLine('UTF-8') { line ->
                def cls = line.replaceAll('#.*', '').trim()
                if (cls.isEmpty()) return
                total++
                def classFile = classesDir.get().file(cls.replace('.', '/') + '.class').asFile
                if (!classFile.exists()) {
                    missing << "${f.name} -> ${cls}"
                }
            }
        }

        if (!missing.isEmpty()) {
            throw new GradleException(
                    "META-INF/services 里有 ${missing.size()} 个类不存在（多半是改名或搬包后忘了同步）:\n  "
                            + missing.join('\n  '))
        }
        logger.lifecycle("SPI 服务文件校验通过：${total} 个类全部存在")
    }
}

tasks.named('check').configure { dependsOn tasks.named('verifyServiceFiles') }

// ============================================================
//  dist 隔离校验
// ============================================================
//
// 专用服务器上没有客户端类。NeoForge 的 RuntimeDistCleaner 在加载
// net.minecraft.client.* 时直接抛异常——而触发它的不是"执行到了那句代码"，
// 是"JVM 校验那个类"。一个类只要【常量池里写着】客户端类型，哪怕那段代码被
// isClientSide() 挡得死死的、服务端永远执行不到，只要它在服务端被加载，
// 就会当场崩服。1.0.44 就是这么把一台 453 个模组的服务器打崩的。
//
// 1.2.11 重排包结构之后，这条界线终于能用一条规则表达：
//
//     路径里有 /client/ 的类才准引用客户端类型，其余一概不准。
//
// 原来靠 gui/ 与 client/ 两个顶层包名判断，而 gui/app/BrowserApp 这种东西
// 靠包名根本推断不出该不该算客户端——现在是断言，不是推断。
//
// 校验直接在 .class 字节里搜常量池：类型名在常量池里以 modified-UTF8 存着，
// 原样搜字符串就够，不必解析 class 结构。这比读源码可靠——import 看不出
// 校验期会加载什么。
tasks.register('verifyDistIsolation') {
    description = '校验非 client 包的类没有引用客户端类型'
    group = 'verification'

    dependsOn tasks.named('compileJava')

    // 客户端专属的标记：常量池里出现这些就说明这个类碰了客户端
    def clientMarkers = [
            'net/minecraft/client/',
            'com/mojang/blaze3d/',
            'com/cinemamod/mcef',
            'org/cef/',
    ]

    // 白名单。加进来的每一条都要写清楚为什么它是安全的
    def allowed = [
            // 客户端入口，@Mod(dist = Dist.CLIENT) 标注，服务端根本不会构造它
            'com/november/mcphone/MCphoneClient.class',
    ]

    def classesDir = layout.buildDirectory.dir('classes/java/main')
    inputs.dir(classesDir).optional()

    doLast {
        def root = classesDir.get().asFile
        if (!root.exists()) return

        def offenders = []
        def checked = 0

        root.eachFileRecurse { f ->
            if (!f.name.endsWith('.class')) return
            def rel = root.toPath().relativize(f.toPath()).toString().replace('\\', '/')
            if (rel.contains('/client/')) return          // 这些包本来就准
            if (allowed.contains(rel)) return
            checked++

            def bytes = f.getBytes()
            def text = new String(bytes, 'ISO-8859-1')    // 逐字节，不解码
            def hit = clientMarkers.find { text.contains(it) }
            if (hit != null) {
                offenders << "${rel}  （引用了 ${hit}）"
            }
        }

        if (!offenders.isEmpty()) {
            throw new GradleException(
                    "dist 隔离被破坏：${offenders.size()} 个非 client 包的类引用了客户端类型。\n"
                            + "这些类一旦在专用服务器上被加载就会当场崩服。\n  "
                            + offenders.join('\n  '))
        }
        logger.lifecycle("dist 隔离校验通过：${checked} 个非 client 类，无一引用客户端类型")
    }
}

tasks.named('check').configure { dependsOn tasks.named('verifyDistIsolation') }

// ============================================================
//  build/libs 只留最新三个 jar
// ============================================================
//
// 每个改动都会把补丁号 +1，而 jar 任务从不清理旧产物：一天下来 build/libs 里
// 躺着十几个只差一个补丁号的 jar。往服务器传的时候要在里面认哪个是最新的，
// 认错一次就是把旧版本发上去，而那种事在服务器上表现成"改的东西没生效"，
// 没人会想到是传错了文件。
//
// 留三个而不是一个：最新的那个是要传的，前两个是出事时立刻退回去的退路。
//
// 按文件时间排，不按版本号——版本号在这里是字符串，1.7.9 会排到 1.7.36 后面去。
// 挂在 jar 的 finalizedBy 上：不管是 jar、assemble 还是 build，只要真打出了包就顺手清一次。
tasks.register('pruneOldJars') {
    description = 'build/libs 里只留最新的三个 jar'
    group = 'build'

    // 这两个要在配置期取好：doLast 里碰 project 会让配置缓存失效
    def libsDir = layout.buildDirectory.dir('libs')
    def prefix = "${mod_id}-"
    def keep = 3

    doLast {
        def dir = libsDir.get().asFile
        if (!dir.exists()) return

        def jars = dir.listFiles({ File f ->
            f.isFile() && f.name.startsWith(prefix) && f.name.endsWith('.jar')
        } as FileFilter)
        if (jars == null || jars.length <= keep) return

        jars.toList()
                .sort { a, b -> b.lastModified() <=> a.lastModified() }
                .drop(keep)
                .each {
                    logger.lifecycle("删掉旧 jar：${it.name}")
                    it.delete()
                }
    }
}

tasks.named('jar').configure { finalizedBy tasks.named('pruneOldJars') }

// ============================================================
//  断言测试
// ============================================================
//
// docs/ 下那几份 *Test.java 是带 main() 的独立断言测试。不用 JUnit 是因为
// 它们要的是【真实的 Minecraft 类路径】——NbtOps、FriendlyByteBuf、UUIDUtil
// 都是真货，测的就是"这些东西凑在一起对不对"，换成 mock 就什么都没测到。
// 每份自己数断言、自己汇总，失败时 System.exit(1)。
//
// 它们守的是没有别的守卫的地方：ChatMessage 的存档格式（整份聊天记录是一个
// Codec 解出来的，中间一条读不懂，结果不是"少一条消息"而是全服记录一起消失）、
// GIF 拆帧、图片编码、会话键、天气与世界时钟的取值。这几样出事时都是静默的。
//
// 【问题是它们一直没进构建】。跑法写在各自的类注释里，靠人手动 javac + java
// 跑一遍——也就是说没人跑的时候，它们等于不存在。十二万条断言全绿过，但那是
// 某一次、某个人、在自己机器上的事。
//
// 现在挂在 check 上，跟着每一次 ./gradlew build 跑。两份 workflow 跑的都是
// build，所以 CI 自动就带上了，workflow 一个字都不用改。
//
// docs/AddonApiExamples.java 没有 main()，所以只编不跑——而"编得过"本身就是
// 它该受的那道校验：对外 API 的示例代码不能是编不过的。

def assertTestsClasses = layout.buildDirectory.dir('classes/assert-tests')
// 递归而不是只扫顶层：把测试挪进子目录是个再自然不过的整理动作，而顶层写死的
// '*.java' 遇上它是【静默少跑几份】，不是报错。
def assertTestsSource = fileTree('docs') { include '**/*.java' }
def projectToolchain = java.toolchain

// 哪几份带 main()：读文件头现判，【不要】在这里维护一张手写清单。
// 加了一份测试却忘了往清单里补，症状是"构建绿的，但那份根本没跑"——
// 而这整节存在的理由，就是不再让"没人跑"这件事悄悄发生。
def assertTestMains = assertTestsSource.files.toSorted { it.name }.findResults { f ->
    def text = f.getText('UTF-8')
    // 修饰符顺序不固定（static public void main 一样合法），所以两个词分开断言，
    // 不写成一串固定顺序——写死的那种漏掉时也是静默的
    if (!(text =~ /(?m)^\s*(?=[^\n]*\bpublic\b)(?=[^\n]*\bstatic\b)[^\n]*\bvoid\s+main\s*\(/)) return null
    def pkg = (text =~ /(?m)^\s*package\s+([\w.]+)\s*;/)
    def simple = f.name - '.java'
    // 没写 package 的就是默认包，类名本身即全限定名。这里【不能】返回 null 悄悄丢掉它 ——
    // 那等于给这一节留了个"有测试但不跑"的后门
    (pkg ? "${pkg[0][1]}.${simple}" : simple).toString()
}

// 一份都没找到时怎么办，见下面 assertTests 的 doFirst：
// 【绝不能】当成"没有测试"往下走。

tasks.register('compileAssertTests', JavaCompile) {
    description = '编译 docs/ 下的断言测试与 API 示例'
    group = 'verification'

    source = assertTestsSource
    // 主源码的产物 + 它的编译类路径：与各测试类注释里那条手写的 javac 命令等价
    classpath = files(sourceSets.main.output, sourceSets.main.compileClasspath)
    destinationDirectory = assertTestsClasses
    javaCompiler = javaToolchains.compilerFor(projectToolchain)
}

// 一份测试一个 JavaExec 任务，而不是在 doLast 里 javaexec ——
// 后者在配置缓存下不成立（本工程 org.gradle.configuration-cache=true）。
def assertTestTasks = assertTestMains.collect { fqcn ->
    def simple = fqcn.substring(fqcn.lastIndexOf('.') + 1)
    tasks.register("assertTest${simple}", JavaExec) {
        description = "跑 ${simple}"
        group = 'verification'
        dependsOn tasks.named('compileAssertTests')
        classpath = files(assertTestsClasses, sourceSets.main.output, sourceSets.main.compileClasspath)
        mainClass = fqcn
        javaLauncher = javaToolchains.launcherFor(projectToolchain)
    }
}

tasks.register('assertTests') {
    description = '跑 docs/ 下所有带 main() 的断言测试'
    group = 'verification'
    dependsOn assertTestTasks

    def names = assertTestMains.collect { it.substring(it.lastIndexOf('.') + 1) }

    // 一份都没发现，绝不能当成"没有测试"就放行。
    //
    // 发现逻辑坏掉的方式不需要多离奇：docs/ 改个名、测试整体搬走、上面那个正则被
    // 一次格式化打断。而它坏掉之后 compileAssertTests 是 NO-SOURCE、这个任务没有
    // 任何依赖，check 照样全绿 —— 十二万条断言一条没跑，没有任何东西会告诉你。
    // 「手写清单漏一条」与「整张清单为空」是同一个病的两种得法，这一节两种都要堵。
    //
    // 放在 doFirst 而不是配置期：配置期抛会连 ./gradlew tasks 和 IDE 的工程同步
    // 一起打死，而这道断言只在"真要跑测试"时才有意义。挂在 check 上，CI 照样跑得到。
    doFirst {
        if (names.isEmpty()) {
            throw new GradleException(
                    'docs/ 下一份带 main() 的断言测试都没找到。\n' +
                    '这不是"没有测试"，是发现逻辑坏了：文件被挪走或改名，或者判 main() 的那个正则失效了。\n' +
                    '就这么放行的话 check 会全绿，而断言一条都没跑。')
        }
    }

    // 把"跑了几份、跑了哪几份"印出来。上面那条只挡得住"一份都没有"，
    // 少跑几份仍然是静默的 —— 这一行是留给人看的那道防线，CI 日志里翻得到
    doLast { logger.lifecycle("断言测试 ${names.size()} 份跑完：${names.join('、')}") }
}

tasks.named('check').configure { dependsOn tasks.named('assertTests') }

// ============================================================
//  Java 21 专有 API 校验
// ============================================================
//
// 1.20.1 那一支跑在 Java 17 上。源码里一旦出现 21 才有的东西，那一支就编不过，
// 而这边编得好好的，什么都不会说。
//
// 眼下只卡一样：Math.clamp（Java 21 新增）。它不是随便挑的：
//
//   - 它是【库方法】不是语法，除了 grep 没有别的东西扫得出来
//   - 报错是 cannot find symbol，看着像打错字，跟"Java 版本"四个字毫无关联
//   - IDE 的检查会主动建议拿它替掉 Mth.clamp —— 也就是说，把它改回来是一个
//     完全合理、不会有人拦的动作。这条规矩不写成断言，就只活在某一次提交的意图里
//
// 换法：net.minecraft.util.Mth.clamp，int/long/float/double 四个重载都在。
//
// 有一处行为差异，知道就行，不必改回去：Math.clamp 在 min > max 时抛
// IllegalArgumentException，Mth.clamp 不抛，静默返回某一侧边界。也就是说
// Math.clamp 顺带充当的那个"边界算反了就当场炸"的断言没有了。换的时候 28 处
// 上界逐个查过：滚动量全是 Math.max(0, …) 兜住的，只有两个滑块把手
// （HudPage、UiScalePage）在窗口窄到 barW < KNOB_W 时能倒置——而那一处正好是
// 从"渲染里抛异常炸掉整个界面"退化成"把手贴在左边"，方向是变安全的。
//
// 还没卡进来的，等 switch 那一处退回 instanceof 链之后一起加：switch 里的
// 类型模式与记录模式（JEP 440/441，core/PhoneLocation 眼下还在用），字符串模板。
tasks.register('verifyNoJava21Api') {
    description = '校验源码里没有 Java 21 才有的 API（1.20.1 那一支跑在 17 上）'
    group = 'verification'

    // docs/ 也要扫：AddonApiExamples 是给附属作者照抄的示例，它带头用错更糟
    def scanned = files(
            fileTree('src/main/java') { include '**/*.java' },
            fileTree('docs') { include '**/*.java' })
    def root = projectDir

    inputs.files(scanned)

    doLast {
        def offenders = []
        scanned.each { f ->
            def rel = root.toPath().relativize(f.toPath()).toString()
            f.eachLine('UTF-8') { line, n ->
                if (line.contains('Math.clamp(')) {
                    offenders << "${rel}:${n}  Math.clamp —— 换成 net.minecraft.util.Mth.clamp"
                }
            }
        }
        if (!offenders.isEmpty()) {
            throw new GradleException(
                    "用到了 Java 21 才有的 API，1.20.1 那一支会编不过：\n  " + offenders.join('\n  '))
        }
        logger.lifecycle('Java 21 专有 API 校验通过')
    }
}

tasks.named('check').configure { dependsOn tasks.named('verifyNoJava21Api') }
